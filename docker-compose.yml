services:
  kobo-sync:
    image: ghcr.io/adamratson/simple-kobo-sync-service:latest
    ports:
      - "8080:8080"
    environment:
      KOBO_TOKEN: ${KOBO_TOKEN:?KOBO_TOKEN must be set}
      KOBO_EXTERNAL_URL: ${KOBO_EXTERNAL_URL:?KOBO_EXTERNAL_URL must be set, e.g. 192.168.0.3}
      KOBO_EPUB_DIR: /data/epubs
      # Optional: set to 0 to serve raw EPUBs instead of converting them to KEPUB.
      KOBO_KEPUBIFY: ${KOBO_KEPUBIFY:-1}
      # Optional: enables Hardcover metadata enrichment (description, series, publisher, covers).
      HARDCOVER_API_KEY: ${HARDCOVER_API_KEY:-}
      HARDCOVER_CACHE_DIR: /data/cache
      # Optional: require this password (any username) for the web UI.
      KOBO_UI_PASSWORD: ${KOBO_UI_PASSWORD:-}
    volumes:
      # Writable so books can be uploaded and deleted from the web UI (the folder
      # must be writable by uid 65532). Append :ro to make the library read-only.
      - ${EPUB_DIR:-./epubs}:/data/epubs
      # Writable cache for fetched Hardcover metadata, cover images, and converted kepubs.
      - ${CACHE_DIR:-./cache}:/data/cache
    restart: unless-stopped
